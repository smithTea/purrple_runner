name: Purrple
options:
  bundleIdPrefix: selfbuilt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SFBAudioEngine:
    url: https://github.com/sbooth/SFBAudioEngine
    exactVersion: 0.14.0

targets:
  Purrple:
    type: application
    platform: iOS
    sources:
      - path: Purrple
    dependencies:
      - package: SFBAudioEngine
    info:
      path: Purrple/Info.plist
      properties:
        CFBundleDisplayName: Purrple
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        # Show the app's Documents folder in the Files app and Finder, so music
        # can be dropped in directly.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: selfbuilt.purrple
        PRODUCT_NAME: Purrple
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
